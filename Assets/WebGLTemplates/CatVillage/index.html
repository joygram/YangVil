<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f9efdc">
  <title>냥빌</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #2b211b; touch-action: none; }
    #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #unity-canvas { display: block; background: #f9efdc; outline: none; -webkit-tap-highlight-color: transparent; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #3a2a1e; font: 600 18px system-ui, sans-serif; pointer-events: none; }
    #bar { width: 60%; max-width: 280px; height: 12px; border: 2px solid #3a2a1e; border-radius: 8px; overflow: hidden; }
    #bar-fill { width: 0; height: 100%; background: #6bbf59; transition: width .2s; }
    #error { position: absolute; left: 12px; right: 12px; bottom: 12px; padding: 12px; border-radius: 8px; background: #c0392b; color: #fff; font: 14px system-ui, sans-serif; display: none; }
    #update { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); display: none; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px; background: #3a2a1e; color: #fff; font: 600 15px system-ui, sans-serif; box-shadow: 0 4px 16px rgba(0,0,0,.35); z-index: 10; }
    #update button { border: 0; border-radius: 8px; padding: 8px 12px; background: #6bbf59; color: #fff; font: 700 14px system-ui, sans-serif; cursor: pointer; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>
  <div id="loading"><div>냥빌 불러오는 중…</div><div id="bar"><div id="bar-fill"></div></div></div>
  <div id="error"></div>
  <div id="update"><span>새 버전이 나왔어요</span><button id="update-btn">새로고침</button></div>
  <script>
    (function () {
      var current = null;
      var banner = document.getElementById("update");
      document.getElementById("update-btn").onclick = function () { location.reload(); };
      function check() {
        fetch("version.json?t=" + Date.now(), { cache: "no-store" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (v) {
            if (!v || !v.version) return;
            if (current === null) { current = v.version; return; }
            if (v.version === current) return;
            if (document.hidden) { location.reload(); return; }
            banner.style.display = "flex";
          })
          .catch(function () {});
      }
      check();
      setInterval(check, 60000);
      document.addEventListener("visibilitychange", function () { if (!document.hidden) check(); });
    })();
  </script>
  <script>
    var ASPECT = 9 / 16;
    var canvas = document.getElementById("unity-canvas");

    function fit() {
      var w = window.innerWidth, h = window.innerHeight;
      var cw = Math.min(w, h * ASPECT), ch = cw / ASPECT;
      canvas.style.width = Math.floor(cw) + "px";
      canvas.style.height = Math.floor(ch) + "px";
    }
    window.addEventListener("resize", fit);
    window.addEventListener("orientationchange", fit);
    fit();

    function showError(message) {
      var box = document.getElementById("error");
      box.textContent = message;
      box.style.display = "block";
    }

    var config = {
      arguments: [],
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      showBanner: function (msg, type) { if (type === "error") showError(msg); }
    };

    var script = document.createElement("script");
    script.src = "Build/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        document.getElementById("bar-fill").style.width = (100 * progress) + "%";
      }).then(function () {
        document.getElementById("loading").style.display = "none";
        canvas.focus();
      }).catch(showError);
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
