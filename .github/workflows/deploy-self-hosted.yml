name: Verify & Deploy WebGL (self-hosted)

on:
  push:
    branches: [main]
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - "wrangler.jsonc"
  workflow_dispatch:

concurrency:
  group: deploy-self-hosted
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, unity]
    timeout-minutes: 60
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: https://yangvil.deuklab.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -z "$CLOUDFLARE_API_TOKEN" ] && unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          bash scripts/deploy-web.sh
