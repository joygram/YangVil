name: Verify & Deploy WebGL (self-hosted)

on:
  push:
    branches: [main]
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - "wrangler.jsonc"
  workflow_dispatch:

concurrency:
  group: deploy-self-hosted
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, windows, unity]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/deploy-web.sh

      - if: always()
        shell: bash
        env:
          WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          STATUS: ${{ job.status }}
          COMMIT: ${{ github.event.head_commit.message || github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$WEBHOOK" ] && exit 0
          if [ "$STATUS" = "success" ]; then result="✅ 검증 통과·배포 완료 → https://yangvil.deuklab.workers.dev"; else result="❌ 검증 또는 배포 실패"; fi
          title=$(printf '%s' "$COMMIT" | head -n1)
          text=$(printf '*YangVil WebGL* %s\n%s · %s\n%s' "$result" "$ACTOR" "$title" "$RUN_URL")
          node -e 'process.stdout.write(JSON.stringify({text:process.argv[1]}))' "$text" | curl -sS -X POST -H 'Content-Type: application/json; charset=UTF-8' -d @- "$WEBHOOK"
