name: Verify & Deploy WebGL (self-hosted)

on:
  push:
    branches: [main]
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - "wrangler.jsonc"
  workflow_dispatch:

concurrency:
  group: deploy-self-hosted
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, unity]
    timeout-minutes: 60
    permissions:
      contents: write
      deployments: write
    environment:
      name: production
      url: https://yangvil.deuklab.workers.dev
    env:
      GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      CHANGE_COUNT: ${{ github.event.commits && github.event.commits.length || 1 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - shell: bash
        run: echo "STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -z "$CLOUDFLARE_API_TOKEN" ] && unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          bash scripts/deploy-web.sh

      - if: success()
        shell: bash
        run: |
          secs=$(( $(date +%s) - STARTED_AT ))
          export ELAPSED="$((secs / 60))분 $((secs % 60))초"
          bash scripts/tools/notify-chat.sh done

      - if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          info="${YANGVIL_CHECK_DIR:-$(dirname "$(git rev-parse --show-toplevel)")/YangVil-check}/Builds/WebGL/version.json"
          version="v$(node -p "require(process.argv[1]).version" "$info")"
          notes="$(git log --format='- %s' -n "$CHANGE_COUNT" "$GITHUB_SHA")"
          gh release create "$version" --target "$GITHUB_SHA" --title "냥빌 $version 배포" \
            --notes "$(printf '▶ https://yangvil.deuklab.workers.dev\n\n%s' "$notes")"

      - if: failure()
        shell: bash
        run: bash scripts/tools/notify-chat.sh fail
